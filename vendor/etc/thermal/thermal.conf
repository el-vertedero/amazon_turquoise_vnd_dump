[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF]
thermal_zone= soc_max
mode= enabled
policy= power_allocator
switch_on_temp= 80000
control_temp= 85000
critical_temp= 103000

[mtk-cpu-table-mapping]
mode= enabled
sensor= soc_max
cluster= 0
threshold= [90000, 92500, 95000]
hysteresis= [4999, 4999, 4999]
freq= [950000, 750000, 500000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= soc_max
cluster= 1
threshold= [90000, 92500, 95000]
hysteresis= [4999, 4999, 4999]
freq= [1050000, 850000, 550000]

[mtk-gpu-table-mapping]
mode= enabled
sensor= soc_max
threshold= [90000, 92500, 95000]
hysteresis= [4999, 4999, 4999]
freq= [560000, 492000, 390000]
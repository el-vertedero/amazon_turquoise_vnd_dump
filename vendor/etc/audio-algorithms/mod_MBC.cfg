{
    "Module Type":           "MBCompressor",

    "Bypass"            : false,
    "Num Bands"         : 4,
    "Num Channels"      : 2, // Linked 2 channel block
    "Process Channels"  : [0, 1], // Left, Right
    "Process Bands"     : [0, 1, 2, 3], // length equal to "Num Bands"
    "FilterBank FC"     : [250, 1000, 6000], // Hz, always 4 bands and 3 cutoff frequencies
    "Attack Time"       : [40.0, 20.0, 10.0, 10.0], // milliseconds, attack time per band
    "Release Time"      : [400.0, 200.0, 100.0, 100.0], // milliseconds, release time per band
    "Input Gain"        : [-2.0, -2.0, -2.0, -2.0], // dB, input gain per band
    "Output Gain"       : [0.0, 0.0, 4.0, 4.0], // dB, output gain ("makeup gain") per band
    "Threshold"         : [-10.0, -15.0, -10.0, -10.0], // dB, per band compression threshold
    "Ratio"             : [10.0, 5.0, 5.0, 5.0],     // per band compression ratio (input dB delta to generate a 1-dB output delta)
    "LookAhead Time"    : 1.0 // milliseconds, compressor latency
}

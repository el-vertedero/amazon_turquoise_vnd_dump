{
    "Module Type":  "SpatialAudioProcessing",

    "Global setting":
    {
        "enable": true,
        "bypass": false,
        "add center to left and right" : true
    },

    "Center Channel Extractor":
    {
        "enable": true,
        "downmix": true,
        "low latency": true,
        "use momentum": true,
        "filter update rate": 62.5,
        "leakage update Hz": 2400,
        "mid power ratio threshold": 0.031622776601684, // db2mag(-15)^2
        "magnitude sensitivity": 0.15,
        "phase sensitivity": 2.0
    },

    "MBC Side":
    {
        "Bypass"            : false,
        "Num Bands"         : 4,
        "Num Channels"      : 2, // Linked 2 channel block
        "Process Channels"  : [0, 1], // Left, Right
        "Process Bands"     : [0, 1, 2, 3], // length equal to "Num Bands"
        "FilterBank FC"     : [115, 1750, 7500], // Hz, always 4 bands and 3 cutoff frequencies, must match center FC
        "Attack Time"       : [0.0, 0.0, 0.0, 0.0], // milliseconds, attack time per band
        "Release Time"      : [10.0, 4.3478, 0.2857, 0.0667], // milliseconds, release time per band
        "Input Gain"        : [0.0,  0.0, 0.0, 0.0], // dB, input gain per band
        "Output Gain"       : [0.0,  0.0, 0.0, 0.0], // dB, output gain ("makeup gain") per band
        "Threshold"         : [-1.7749, -15.1283,  -30.9607,  -11.5578], // dB, per band compression threshold
        "Ratio"             : [3.0, 3.0, 3.0, 3.0],     // per band compression ratio (input dB delta to generate a 1-dB output delta)
        "LookAhead Time"    : 0.0 // milliseconds, compressor latency
    },

    "MBC Center":
    {
        "Bypass"            : false,
        "Num Bands"         : 4,
        "Num Channels"      : 1, // Linked 1 channel block
        "Process Channels"  : [2], // Center
        "Process Bands"     : [0, 1, 2, 3], // length equal to "Num Bands"
        "FilterBank FC"     : [115, 1750, 7500], // Hz, always 4 bands and 3 cutoff frequencies, must match side FC
        "Attack Time"       : [100.0, 100.0, 100.0, 100.0], // milliseconds, attack time per band
        "Release Time"      : [1000.0, 1000.0, 1000.0, 1000.0], // milliseconds, release time per band
        "Input Gain"        : [0.0, 0.0, 0.0, 0.0], // dB, input gain per band
        "Output Gain"       : [0.0, 3.0, 3.0, 0.0], // dB, output gain ("makeup gain") per band
        "Threshold"         : [0.0, 0.0, 0.0, 0.0], // dB, per band compression threshold
        "Ratio"             : [1.0, 1.0, 1.0, 1.0], // per band compression ratio (input dB delta to generate a 1-dB output delta)
        "LookAhead Time"    : 0.0 // milliseconds, compressor latency
    },


    "Spatial Mono EQ":
    {
        "External Config": [ "SpatialAudio_UnityEQ.cfg" ]
    },

    //"Spatial Mono EQ Tuple":
    //{
    //    "External Config": [ "SpatialAudio_MonoEQTuple.cfg" ]
    //},

    "Crossover Low":
    {
        "External Config": [ "SpatialAudio_UnityEQ.cfg" ]
    },

    "Crossover High":
    {
        "External Config": [ "SpatialAudio_ZeroEQ.cfg" ]
    },

    "Cross Talk Canceler":
    {
        "Filter type": "IIR",     // "IIR" or "FD FIR"

        "Ipsi Filter FIR":
        {
            "Bypass"                : false,
            "Partition Length"      : 384,
            "FFT Size"              : 1024,
            "External Coefficients" : [ "SpatialAudio_XTC_Ipsi_FIR_d_476.cfg" ],
            "Volume Boundary"       : [ 0, 1, 2 ]  // Volume boundary is getting overwritten with position information
        },

        "Contra Filter FIR":
        {
            "Bypass"                : false,
            "Partition Length"      : 384,
            "FFT Size"              : 1024,
            "External Coefficients" : [ "SpatialAudio_XTC_Cont_FIR_d_476.cfg" ],
            "Volume Boundary"       : [ 0, 1, 2 ]  // Volume boundary is getting overwritten with position information
        },

        "Ipsi Filter IIR":
        {
            "External Config":  [ "SpatialAudio_XTC_Ipsi_IIR.cfg" ]
        },

        "Contra Filter IIR":
        {
            "External Config":  [ "SpatialAudio_XTC_Cont_IIR.cfg" ]
        }
    },

    "Cross Talk Canceler Delay":
    {
        //IIR is group delay + 3 * number of sections, FIR is group delay
        "Delay in samples": 66
    },

    "Side Content EQ Low":
    {
        "External Config": [ "SpatialAudio_SideContentEQ.cfg" ]
    },

    "Side Content EQ High":
    {
        "External Config": [ "SpatialAudio_ZeroEQ.cfg" ]
    },

    //"Dialogue Enhancement Side EQ":
    //{
    //    "External Config": [ "SpatialAudio_DialogueEnhSideEQ.cfg" ]
    //},

    //"Dialogue Enhancement Center EQ":
    //{
    //    "External Config": [ "SpatialAudio_DialogueEnhCenterEQ.cfg" ]
    //},

    "Side Content Gain":
    {
        "GaindB": 0.0
    },

    "Center Channel Delay":
    {
        //Cross-over Delay (Group delay + 3*number sections) +  Cross Talk Canceler Delay + Side Content EQ Delay (Group delay + 3*number sections)
        "Delay in samples": 75
    },

    //"Spectrum Matching EQ":
    //{
    //    "External Config": [ "SpatialAudio_UnityEQ.cfg" ]
    //},

    "Bypass Delay":
    {
        //(3840 high latency, 384 low latency) + Center Channel Delay + Spectrum Matching EQ Delay (Group delay + 3*number sections) + Mono EQ Delay (Group delay + 3 * number sections)  - Bypass EQ Delay (Group delay + 3 * number sections)
        "Delay in samples": 462
    }

    //"Bypass EQ":
    //{
    //    "External Config": [ "SpatialAudio_UnityEQ.cfg" ]
    //}

    //"Bypass EQ Tuple":
    //{
    //    "External Config": [ "SpatialAudio_BypassedEQTuple.cfg" ]
    //}

}